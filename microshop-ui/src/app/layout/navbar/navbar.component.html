<nav class="layout-navbar bg-white shadow-2 px-4 py-3 sticky top-0 z-5 border-bottom-1 border-200">
  <div class="max-w-7xl mx-auto flex justify-content-between align-items-center">

    <!-- Logo & Brand -->
    <a routerLink="/shop" class="flex align-items-center gap-3 cursor-pointer no-underline">
      <div class="bg-gradient-to-r from-primary to-primary-600 border-round-xl p-3 flex align-items-center justify-content-center shadow-2">
        <i class="pi pi-shopping-bag text-xl text-white"></i>
      </div>
      <div class="hidden sm:block">
        <span class="text-2xl font-bold text-900 line-height-3">MicroShop</span>
        <div class="text-xs text-500 font-medium">Modern E-Commerce</div>
      </div>
    </a>

    <!-- Search Bar - Desktop -->
    <div class="hidden md:flex align-items-center flex-1 max-w-md mx-6">
      <div class="relative w-full">
        <i class="pi pi-search absolute left-0 ml-4 mt-3 text-400 z-2"></i>
        <input
          type="text"
          placeholder="Ürün, kategori veya marka ara..."
          class="w-full pl-6 pr-4 py-3 border-round-xl border-1 border-200 bg-gray-50 text-700 font-medium text-sm focus:outline-none focus:border-primary focus:bg-white transition-all duration-200"
        />
      </div>
    </div>

    <!-- Right Section -->
    <div class="flex align-items-center gap-4">

      <!-- Mobile Search Icon -->
      <button class="md:hidden p-button p-button-text p-button-rounded p-button-secondary">
        <i class="pi pi-search text-xl"></i>
      </button>

      <!-- Auth Section -->
      <div class="flex align-items-center gap-3">
        <!-- Not Logged In -->
        <ng-container *ngIf="!(isLoggedIn$ | async)">
          <a routerLink="/auth/register" class="hidden sm:block text-600 font-medium no-underline hover:text-900 transition-colors">
            Kayıt Ol
          </a>
          <a routerLink="/auth/login"
             class="inline-flex align-items-center gap-2 bg-primary text-white px-4 py-2 border-round-lg font-medium text-sm hover:bg-primary-700 transition-colors no-underline">
            <i class="pi pi-user"></i>
            Giriş Yap
          </a>
        </ng-container>

        <!-- Logged In -->
        <ng-container *ngIf="isLoggedIn$ | async">
          <!-- Seller Panel Link (Only for Sellers) -->
          <a *ngIf="isSeller()"
             routerLink="/seller"
             class="flex align-items-center gap-2 bg-green-50 text-green-700 px-3 py-2 border-round-lg font-medium text-sm hover:bg-green-100 transition-colors no-underline"
             pTooltip="Satıcı Paneli">
            <i class="pi pi-shop text-sm"></i>
            <span class="hidden sm:inline">Satıcı Paneli</span>
          </a>

          <div class="flex align-items-center gap-3 bg-gray-50 border-round-xl px-3 py-2" *ngIf="currentUser$ | async as user">
            <p-avatar
              [label]="user.name?.charAt(0) || user.email.charAt(0)"
              styleClass="bg-primary text-white font-bold"
              size="normal">
            </p-avatar>
            <div class="hidden sm:block">
              <div class="text-sm font-semibold text-900">{{ user.name || 'Kullanıcı' }}</div>
              <div class="text-xs text-500">{{ user.email }}</div>
            </div>
          </div>

          <button
            (click)="logout()"
            class="p-button p-button-text p-button-rounded p-button-secondary"
            pTooltip="Çıkış Yap">
            <i class="pi pi-sign-out text-lg"></i>
          </button>
        </ng-container>
      </div>

      <!-- Cart -->
      <div class="relative">
        <a routerLink="/basket"
           class="flex align-items-center justify-content-center w-3rem h-3rem bg-gray-50 border-round-xl hover:bg-primary hover:text-white transition-all duration-200 cursor-pointer no-underline">
          <i class="pi pi-shopping-cart text-xl"></i>
        </a>
        <span
          *ngIf="basketCount$ | async as count"
          class="absolute -top-2 -right-2 text-white text-xs font-bold border-round-xl px-2 py-1 min-w-1rem text-center"
          [ngClass]="count > 0 ? 'bg-danger' : 'bg-gray-400'">
          {{ count }}
        </span>
      </div>    </div>
  </div>
</nav>
