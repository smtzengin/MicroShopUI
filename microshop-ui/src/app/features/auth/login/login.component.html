<p-toast position="top-right"></p-toast>

<div class="flex min-h-screen">

    <div class="hidden md:flex md:col-6 lg:col-7 bg-no-repeat bg-cover relative"
         style="background-image: url('https://images.unsplash.com/photo-1556742049-0cfed4f7a07d?q=80&w=1000&auto=format&fit=crop');">
        <div class="absolute top-0 left-0 w-full h-full bg-black-alpha-40 flex align-items-center justify-content-center">
            <div class="text-white text-center px-5">
                <h1 class="text-5xl font-bold mb-3">MicroShop'a Hoşgeldin</h1>
                <p class="text-xl">En yeni teknolojiler, en uygun fiyatlarla kapınızda.</p>
            </div>
        </div>
    </div>

    <div class="col-12 md:col-6 lg:col-5 flex flex-column justify-content-center surface-ground relative">

        <div class="absolute top-0 left-0 m-4">
            <p-button label="Mağazaya Dön" icon="pi pi-arrow-left" [text]="true" routerLink="/shop" severity="secondary"></p-button>
        </div>

        <div class="flex align-items-center justify-content-center flex-grow-1">
            <div class="surface-card p-6 shadow-2 border-round w-full lg:w-30rem">

                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Giriş Yap</div>
                    <span class="text-600 font-medium line-height-3">Hesabın yok mu?</span>
                    <a routerLink="/auth/register" class="font-medium no-underline ml-2 text-primary cursor-pointer">Kayıt Ol</a>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                    <label for="email" class="block text-900 font-medium mb-2">E-Posta</label>
                    <input id="email" type="text" pInputText formControlName="email" class="w-full mb-3" placeholder="Email adresiniz"
                           [ngClass]="{'ng-invalid ng-dirty': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">

                    <label for="password" class="block text-900 font-medium mb-2">Şifre</label>
                    <p-password id="password" formControlName="password" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full mb-3"
                                [feedback]="false" placeholder="••••••••"
                                [ngClass]="{'ng-invalid ng-dirty': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"></p-password>

                    <div class="flex align-items-center justify-content-between mb-5">
                        <div class="flex align-items-center">
                            <p-checkbox id="rememberme" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme">Beni Hatırla</label>
                        </div>
                        <a class="font-medium no-underline ml-2 text-primary text-right cursor-pointer">Şifremi unuttum</a>
                    </div>

                    <p-button label="Giriş Yap" type="submit" [loading]="loading" styleClass="w-full"></p-button>
                </form>
            </div>
        </div>
    </div>
</div>
